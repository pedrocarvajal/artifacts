name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: prune expired artifacts
        run: bun tools/prune.ts --expired

      - name: commit the sweep
        run: |
          if ! git diff --quiet; then
            git config user.name "llm-artifacts[bot]"
            git config user.email "llm-artifacts[bot]@users.noreply.github.com"
            git commit -am "chore(artifact): prune expired"
            git push
          fi

      - name: build the site
        run: |
          rm -rf _site
          mkdir _site
          rsync -a \
            --exclude .git --exclude .github --exclude _meta --exclude tools \
            --exclude _site --exclude README.md --exclude .artifacts-repo.json \
            ./ _site/
          bun tools/build-index.ts --meta _meta --out _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - uses: actions/deploy-pages@v4
